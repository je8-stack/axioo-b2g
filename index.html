<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Katalog Laptop B2G - PT Tera Data Indonusa Tbk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style> html { scroll-behavior: smooth; } </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCAy5igER74zBCaAHuwQRFNe8xfbiNCQDw",
        authDomain: "axioo-b2g.firebaseapp.com",
        projectId: "axioo-b2g",
        storageBucket: "axioo-b2g.firebasestorage.app",
        messagingSenderId: "184435113641",
        appId: "1:184435113641:web:5b96fef036385f6a1cf3b8",
        measurementId: "G-0F2W1WM69L"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // --- Fungsi Login ---
      async function handleFirebaseLogin() {
          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;
          const errorElement = document.getElementById("loginErrorMessage");
          try {
              await signInWithEmailAndPassword(auth, email, password);
              errorElement.classList.add("hidden");
          } catch (error) {
              errorElement.innerText = "Email atau Password salah.";
              errorElement.classList.remove("hidden");
          }
      }

      // --- Fungsi Reset Password ---
      async function handlePasswordReset() {
          const email = document.getElementById("resetEmail").value;
          const errorElement = document.getElementById("resetErrorMessage");
          if (!email) { errorElement.innerText = "Masukkan email Anda."; errorElement.classList.remove("hidden"); return; }
          
          try {
              await sendPasswordResetEmail(auth, email);
              alert("Link reset password telah dikirim ke email Anda.");
              showLoginForm();
          } catch (error) {
              errorElement.innerText = "Gagal: " + error.message;
              errorElement.classList.remove("hidden");
          }
      }

      // UI Helper
      window.showResetForm = () => {
          document.getElementById('loginFormContainer').classList.add('hidden');
          document.getElementById('resetPasswordForm').classList.remove('hidden');
      };

      window.showLoginForm = () => {
          document.getElementById('loginFormContainer').classList.remove('hidden');
          document.getElementById('resetPasswordForm').classList.add('hidden');
      };

      // Bind events
      document.getElementById("btnSubmitLogin").addEventListener("click", handleFirebaseLogin);
      window.handlePasswordReset = handlePasswordReset;

      onAuthStateChanged(auth, (user) => {
          const overlay = document.getElementById("loginOverlay");
          const content = document.getElementById("mainContent");
          if (user) { overlay.classList.add("hidden"); content.classList.remove("hidden"); }
          else { overlay.classList.remove("hidden"); content.classList.add("hidden"); }
      });
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans w-full overflow-x-hidden">

    <div id="loginOverlay" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-[100] px-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full border border-gray-100 text-center">
            <img src="1920px-Logo_Axioo_Baru.png" alt="Logo" class="h-6 mx-auto mb-6 object-contain">
            
            <div id="loginFormContainer" class="space-y-3 text-left">
                <h2 class="text-base font-bold text-gray-800 text-center">Portal PM Commercial</h2>
                <div>
                    <label class="text-[11px] font-bold text-gray-500 block">Email</label>
                    <input type="email" id="loginEmail" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-gray-500 block">Password</label>
                    <input type="password" id="loginPassword" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <button type="button" onclick="showResetForm()" class="text-[10px] text-blue-600 hover:underline font-medium">Lupa Password?</button>
                <p id="loginErrorMessage" class="text-red-500 text-[11px] hidden font-medium"></p>
                <button id="btnSubmitLogin" class="w-full bg-blue-900 text-white py-2 rounded-lg text-xs font-semibold hover:bg-blue-800">Masuk</button>
            </div>

            <div id="resetPasswordForm" class="hidden space-y-3 text-left">
                <h2 class="text-base font-bold text-gray-800 text-center">Reset Password</h2>
                <p class="text-[11px] text-gray-500 text-center">Masukkan email Anda untuk menerima link reset.</p>
                <input type="email" id="resetEmail" placeholder="nama@email.com" class="w-full px-3 py-2 border rounded-lg text-sm">
                <p id="resetErrorMessage" class="text-red-500 text-[11px] hidden"></p>
                <button onclick="handlePasswordReset()" class="w-full bg-blue-900 text-white py-2 rounded-lg text-xs font-semibold">Kirim Email</button>
                <button onclick="showLoginForm()" class="w-full text-gray-500 text-xs hover:underline">Kembali ke Login</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        </div>
</body>
</html>
